<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cucina One Link</title>
<link rel="stylesheet" href="styles.css?v=43">
</head>
<body>
<header class="topbar">
  <h1>CUCINA ONE LINK</h1>
  <div class="who" id="who"></div>
</header>

<div id="setup" class="center hidden">
  <div class="login">
    <h2>Almost there</h2>
    <p>Open <code>config.js</code> and paste your Supabase <b>Project URL</b> and
       <b>anon public key</b>, then reload.</p>
  </div>
</div>

<div id="login" class="center hidden">
  <div class="login">
    <h2>Sign in</h2>
    <p>Enter your work email and password.</p>
    <input id="email" type="email" placeholder="you@cucina.com.au" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="signIn">Sign in</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="app" class="shell hidden">
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=43"></script>
<script src="app.js?v=43"></script>
</body>
</html>
